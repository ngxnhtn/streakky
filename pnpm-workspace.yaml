packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource/dm-mono": ^5.3.0
  "@journeyapps/wa-sqlite": ^1.7.2
  "@tanstack/browser-db-sqlite-persistence": 1.0.0-rc.1.5
  "@tanstack/db": 1.0.0-rc.1.5
  "@tanstack/db-sqlite-persistence-core": 1.0.0-rc.1.5
  "@tanstack/node-db-sqlite-persistence": 1.0.0-rc.1.5
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^24
  better-sqlite3: ^12.11.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  fractional-indexing: ^4.0.0
  lucide-react: ^1.78.0
  radix-ui: ^1.8.1
  shadcn: ^4.23.0
  tailwind-merge: ^3.7.1
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plugin-pwa: ^2.0.0
  vite-plus: 1.7.0
  wrangler: ^4.166.0
overrides:
  vite@*: "catalog:"
allowBuilds:
  # its postinstall downloads a PowerSync binary; TanStack DB ships its own wa-sqlite wasm
  "@journeyapps/wa-sqlite": false
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  workerd: true
